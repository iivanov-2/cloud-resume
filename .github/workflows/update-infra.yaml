name: Update infra eveytime CI/CD

on:
  push:
    paths:
      - 'terraform/**'
      - '.github/workflows/update-infra.yaml'
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: infra-deployment
  queue: max

env:
  
  AWS_REGION : eu-central-1 #Change to reflect your Region
  AWS_BUCKET : cloud-resume-devops-journey

# Permission can be added at job level or workflow level    
permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read    # This is required for actions/checkout
jobs:
  UpdateInfra:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v7.0.1

      - name: "Configure AWS Credentials Action for GitHub Actions"
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::204330452644:role/GitHubAction-AssumeRoleWithAction
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform init
        run: |
          ls -alh terraform
          cd terraform
          terraform init

      - name: Terraform format
        run: |
          ls -alh terraform
          cd terraform
          terraform fmt

      - name: Terraform plan
        run: |
          ls -alh terraform
          cd terraform
          terraform plan
          