# This is a basic workflow to help you get started with Actions
name: Update frontend eveytime CI/CD

# Controls when the action will run. Invokes the workflow on push events but only for the main branch
on: workflow_dispatch

env:
  
  AWS_REGION : eu-central-1 #Change to reflect your Region
  AWS_BUCKET : cloud-resume-devops-journey

# Permission can be added at job level or workflow level    
permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read    # This is required for actions/checkout
jobs:
  UpdateFrontEnd:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v7.0.1

      - name: "Configure AWS Credentials Action for GitHub Actions"
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::204330452644:role/GitHubAction-AssumeRoleWithAction
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      # Hello from AWS: WhoAmI
      - name: Upload Frontend to S3 Bucket
        run: |
          ls -alh frontend/
          cd frontend/
          aws s3 sync . s3://${{env.AWS_BUCKET}}

      - name: Trigger Invalidation
        run: |
          cloudfront_id=$(aws cloudfront list-distributions | jq -r '.[].[].[].Id')
          aws cloudfront create-invalidation --distribution-id $cloudfront_id --paths "/*"


