name: Update frontend eveytime CI/CD

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/update-frontend.yaml'
    branches:
      - 'main'
  workflow_dispatch:
concurrency:
  group: frontend-deployment
  queue: max #Change to reflect your Region

# Permission can be added at job level or workflow level    
permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read    # This is required for actions/checkout
jobs:
  UpdateFrontEnd:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v7.0.1

      - name: "Configure AWS Credentials Action for GitHub Actions"
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{secrets.AWS_REGION}}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload Frontend to S3 Bucket
        run: |
          ls -alh frontend/
          cd frontend/
          aws s3 sync . s3://${{vars.AWS_BUCKET}} --delete

      - name: Trigger Invalidation
        run: |
          cloudfront_id=$(aws ssm get-parameter --name /dev/cloud-resume/cloudfront/id | jq -r ".Parameter.Value")
          aws cloudfront create-invalidation --distribution-id "$cloudfront_id" --paths "/*"


