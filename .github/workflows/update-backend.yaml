name: Update backend eveytime CI/CD

on:
  push:
    paths:
      - 'backend/lambda/**'
      - '.github/workflows/update-backend.yaml'
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: backend-deployment
  queue: max

env:
  
  AWS_REGION : eu-central-1 #Change to reflect your Region
  AWS_BUCKET : cloud-resume-devops-journey

# Permission can be added at job level or workflow level    
permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read    # This is required for actions/checkout
jobs:
  UpdateFrontEnd:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v7.0.1

      - name: "Configure AWS Credentials Action for GitHub Actions"
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::204330452644:role/GitHubAction-AssumeRoleWithAction
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Lambda code
        run: |
          ls -alh backend/lambda/
          cd backend/lambda/src
          zip -rv /tmp/function.zip lambda_function.py
          visitor_count_lambda=$(aws ssm get-parameter --name /dev/cloud-resume/lambda/name | jq -r ".Parameter.Value")
          aws lambda update-function-code --function-name "$visitor_count_lambda" --zip-file fileb:///tmp/function.zip